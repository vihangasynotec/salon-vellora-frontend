<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Login — Salon Vellora</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: radial-gradient(circle at top right, #fdf2f5 0%, #faf7f8 60%, #f7edf1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      padding: 2.25rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: var(--primary-gradient);
    }
    .login-logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      object-fit: cover;
      margin: 0 auto 1.25rem;
      border: 3px solid var(--primary-light);
      box-shadow: 0 4px 14px rgba(201, 93, 126, 0.2);
    }
    .login-title {
      font-size: 1.65rem;
      margin-bottom: 0.25rem;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
    }
    .quick-roles-panel {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--border);
      text-align: left;
    }
    .quick-roles-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .role-pills-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .role-quick-btn {
      padding: 0.35rem 0.65rem;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: var(--transition);
    }
    .role-quick-btn:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <img src="../assets/logocircel.jpg" alt="Salon Vellora" class="login-logo" onerror="this.src='../assets/salonvelora.png'">
      <h2 class="login-title">Salon Vellora</h2>
      <p class="login-subtitle">Management, POS & Billing Suite</p>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div style="text-align:left; margin-bottom: 1.1rem;">
          <label class="form-label-custom" for="email">Email Address</label>
          <div style="position:relative;">
            <input type="email" id="email" class="form-control-custom" placeholder="name@salonvellora.com" required style="padding-left: 38px;">
            <i data-lucide="mail" style="position:absolute;left:12px;top:10px;width:18px;color:var(--text-light);"></i>
          </div>
        </div>

        <div style="text-align:left; margin-bottom: 1.4rem;">
          <label class="form-label-custom" for="password">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" class="form-control-custom" placeholder="••••••••" required style="padding-left: 38px; padding-right: 38px;">
            <i data-lucide="lock" style="position:absolute;left:12px;top:10px;width:18px;color:var(--text-light);"></i>
            <button type="button" onclick="togglePasswordVisibility()" style="position:absolute;right:10px;top:9px;background:none;border:none;cursor:pointer;color:var(--text-light);">
              <i data-lucide="eye" id="eye-icon" style="width:18px;"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary-custom" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem;">
          <span id="btn-text">Sign In to Dashboard</span>
          <i data-lucide="arrow-right" style="width: 18px;"></i>
        </button>
      </form>

      <!-- Quick Role Switcher for seamless testing -->
      <div class="quick-roles-panel">
        <div class="quick-roles-title">
          <span>Quick Demo Access</span>
          <span style="color:var(--primary);font-size:0.7rem;">Password: password123</span>
        </div>
        <div class="role-pills-wrap">
          <button class="role-quick-btn" onclick="fillCreds('admin@salonvellora.com')">Super Admin</button>
          <button class="role-quick-btn" onclick="fillCreds('manager@salonvellora.com')">Manager</button>
          <button class="role-quick-btn" onclick="fillCreds('reception@salonvellora.com')">Receptionist</button>
          <button class="role-quick-btn" onclick="fillCreds('cashier@salonvellora.com')">Cashier</button>
          <button class="role-quick-btn" onclick="fillCreds('stylist@salonvellora.com')">Stylist Staff</button>
        </div>
      </div>

      <div style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
        <a href="catalog.html" target="_blank" style="color:var(--primary);font-weight:600;display:inline-flex;align-items:center;gap:4px;">
          <i data-lucide="external-link" style="width:14px;"></i> View Public Customer Catalog
        </a>
      </div>

      <div style="margin-top: 1.25rem; font-size: 0.72rem; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border); padding-top: 0.85rem;">
        Developed by <strong style="color:var(--primary-dark);">Lunexa Software (PVT) LTD</strong> by <strong>iTzme VihanGa</strong>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    lucide.createIcons();

    function fillCreds(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'password123';
    }

    function togglePasswordVisibility() {
      const pass = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        pass.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');

      try {
        btn.disabled = true;
        btnText.innerText = 'Authenticating...';

        const res = await auth.login(email, password);
        common.showToast(`Welcome back, ${res.data.user.name}!`, 'success');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 600);
      } catch (err) {
        common.showToast(err.message || 'Login failed. Please check credentials.', 'error');
        btn.disabled = false;
        btnText.innerText = 'Sign In to Dashboard';
      }
    }
  </script>
</body>
</html>
