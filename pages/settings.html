<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Settings — Salon Vellora</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <div id="app-sidebar-placeholder"></div>

    <main class="app-main">
      <div id="app-topbar-placeholder"></div>

      <div class="app-content">
        <div style="max-width: 850px; margin: 0 auto;">
          <form onsubmit="handleSaveSettings(event)">
            <!-- Salon Information Card -->
            <div class="card-custom" style="margin-bottom: 1.5rem;">
              <div class="card-header-clean">
                <h3 class="card-title-clean">Salon Identity & Location Details</h3>
                <span class="badge-custom badge-primary">Branding</span>
              </div>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                  <label class="form-label-custom">Salon Name *</label>
                  <input type="text" id="set-salon_name" class="form-control-custom" required>
                </div>
                <div>
                  <label class="form-label-custom">Business Specialization</label>
                  <input type="text" id="set-business_type" class="form-control-custom">
                </div>
              </div>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                  <label class="form-label-custom">Phone Number *</label>
                  <input type="tel" id="set-salon_phone" class="form-control-custom" required>
                </div>
                <div>
                  <label class="form-label-custom">Email Address *</label>
                  <input type="email" id="set-salon_email" class="form-control-custom" required>
                </div>
              </div>
              <div style="margin-bottom: 1rem;">
                <label class="form-label-custom">Physical Salon Address *</label>
                <input type="text" id="set-salon_address" class="form-control-custom" required>
              </div>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                  <label class="form-label-custom">Business Hours</label>
                  <input type="text" id="set-business_hours" class="form-control-custom">
                </div>
                <div>
                  <label class="form-label-custom">Currency Code</label>
                  <input type="text" id="set-currency" class="form-control-custom" readonly value="LKR">
                </div>
              </div>
            </div>

            <!-- Invoicing & Receipts Configuration -->
            <div class="card-custom" style="margin-bottom: 1.5rem;">
              <div class="card-header-clean">
                <h3 class="card-title-clean">POS Billing & Receipt Rules</h3>
                <span class="badge-custom badge-info">Billing Engine</span>
              </div>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                  <label class="form-label-custom">Invoice Number Prefix</label>
                  <input type="text" id="set-invoice_prefix" class="form-control-custom" value="SV-INV-">
                </div>
                <div>
                  <label class="form-label-custom">Cashier Max Discount Limit (%)</label>
                  <input type="number" id="set-cashier_max_discount" class="form-control-custom" value="10" min="0" max="100">
                </div>
              </div>
              <div style="margin-bottom: 1rem;">
                <label class="form-label-custom">Receipt Footer Thank-You Message</label>
                <input type="text" id="set-invoice_footer" class="form-control-custom">
              </div>
              <div>
                <label class="form-label-custom">Standard Invoice Terms & Conditions</label>
                <textarea id="set-invoice_terms" class="form-control-custom" rows="2"></textarea>
              </div>
            </div>

            <!-- Quotation Configuration -->
            <div class="card-custom" style="margin-bottom: 1.5rem;">
              <div class="card-header-clean">
                <h3 class="card-title-clean">Quotation Engine Defaults</h3>
                <span class="badge-custom badge-purple">Estimates</span>
              </div>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                  <label class="form-label-custom">Quotation Number Prefix</label>
                  <input type="text" id="set-quotation_prefix" class="form-control-custom" value="QTN-">
                </div>
                <div>
                  <label class="form-label-custom">Default Validity Period (Days)</label>
                  <input type="number" id="set-quotation_validity_days" class="form-control-custom" value="30" min="1">
                </div>
              </div>
              <div>
                <label class="form-label-custom">Default Bridal Package Terms</label>
                <textarea id="set-quotation_default_terms" class="form-control-custom" rows="3"></textarea>
              </div>
            </div>

            <!-- Loyalty Program Configuration -->
            <div class="card-custom" style="margin-bottom: 1.5rem;">
              <div class="card-header-clean">
                <h3 class="card-title-clean">Customer Loyalty Program</h3>
                <span class="badge-custom badge-success">Client Retention</span>
              </div>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                  <label class="form-label-custom">Spending Amount for 1 Point (LKR)</label>
                  <input type="number" id="set-loyalty_spend_per_point" class="form-control-custom" value="100" min="1">
                  <span style="font-size:0.75rem; color:var(--text-muted);">e.g. 100 LKR spent = 1 loyalty point</span>
                </div>
                <div>
                  <label class="form-label-custom">Redemption Value per Point (LKR)</label>
                  <input type="number" id="set-loyalty_redemption_value" class="form-control-custom" value="1" min="0.1" step="0.1">
                  <span style="font-size:0.75rem; color:var(--text-muted);">e.g. 1 point = 1 LKR discount</span>
                </div>
              </div>
            </div>

            <div style="display:flex; justify-content:flex-end; margin-bottom: 3rem;">
              <button type="submit" id="btn-save-settings" class="btn-primary-custom" style="padding: 0.75rem 2rem; font-size: 1rem;">
                <i data-lucide="check"></i> Save System Settings
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      common.initLayout("settings", "System Settings", "Salon identity, thermal receipt footers, quotation terms, and loyalty program rules");
      loadSettings();
    });

    async function loadSettings() {
      try {
        const res = await api.get("/settings");
        if (!res.success || !res.data) return;

        for (const [group, groupSettings] of Object.entries(res.data)) {
          groupSettings.forEach(s => {
            const el = document.getElementById(`set-${s.key}`);
            if (el) el.value = s.value || "";
          });
        }
      } catch (e) {
        common.showToast("Failed to load settings.", "error");
      }
    }

    async function handleSaveSettings(e) {
      e.preventDefault();

      const keys = [
        'salon_name', 'business_type', 'salon_phone', 'salon_email', 'salon_address', 'business_hours', 'currency',
        'invoice_prefix', 'cashier_max_discount', 'invoice_footer', 'invoice_terms',
        'quotation_prefix', 'quotation_validity_days', 'quotation_default_terms',
        'loyalty_spend_per_point', 'loyalty_redemption_value'
      ];

      const settings = [];
      keys.forEach(k => {
        const el = document.getElementById(`set-${k}`);
        if (el) {
          settings.push({ key: k, value: el.value.trim() });
        }
      });

      const btn = document.getElementById("btn-save-settings");
      btn.disabled = true;

      try {
        await api.post("/settings", { settings });
        common.showToast("System settings updated successfully!", "success");
      } catch (err) {
        common.showToast(err.message || "Failed to update settings.", "error");
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
