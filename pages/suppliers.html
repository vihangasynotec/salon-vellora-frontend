<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers Directory — Salon Vellora</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <div id="app-sidebar-placeholder"></div>

    <main class="app-main">
      <div id="app-topbar-placeholder"></div>

      <div class="app-content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
          <div>
            <h2 style="font-size:1.3rem;font-weight:700;">Suppliers & Product Vendors</h2>
            <p style="font-size:0.8rem;color:var(--text-muted);margin:0;">Distributors for cosmetic products, styling tools and salon equipment</p>
          </div>
          <button class="btn-primary-custom" onclick="openSupplierModal()" data-permission="purchases.create">
            <i data-lucide="plus-circle"></i> Add Supplier
          </button>
        </div>

        <div class="table-custom-container">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Company Name</th>
                <th>Contact Person</th>
                <th>Phone Number</th>
                <th>Email</th>
                <th>Address</th>
                <th>Current Balance (Payables)</th>
              </tr>
            </thead>
            <tbody id="suppliers-table-body">
              <tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--text-muted);">Loading suppliers...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ADD SUPPLIER MODAL -->
  <div class="modal-overlay" id="supplier-modal">
    <div class="modal-card" style="max-width: 460px;">
      <div class="modal-header-custom">
        <h3 class="card-title-clean">Add Supplier</h3>
        <button class="btn-close-modal" style="background:none;border:none;cursor:pointer;" onclick="closeSupplierModal()"><i data-lucide="x"></i></button>
      </div>
      <form onsubmit="handleSaveSupplier(event)">
        <div class="modal-body-custom">
          <div style="margin-bottom:1rem;">
            <label class="form-label-custom">Company / Vendor Name *</label>
            <input type="text" id="sup-name" class="form-control-custom" required placeholder="e.g. Lanka Beauty Distributors (Pvt) Ltd">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;">
            <div>
              <label class="form-label-custom">Contact Person</label>
              <input type="text" id="sup-contact" class="form-control-custom" placeholder="e.g. Sunil Wickramasinghe">
            </div>
            <div>
              <label class="form-label-custom">Phone Number</label>
              <input type="tel" id="sup-phone" class="form-control-custom" placeholder="011XXXXXXX">
            </div>
          </div>
          <div style="margin-bottom:1rem;">
            <label class="form-label-custom">Email Address</label>
            <input type="email" id="sup-email" class="form-control-custom" placeholder="sales@vendor.lk">
          </div>
          <div>
            <label class="form-label-custom">Company Address</label>
            <input type="text" id="sup-address" class="form-control-custom" placeholder="e.g. Colombo, Sri Lanka">
          </div>
        </div>
        <div class="modal-footer-custom">
          <button type="button" class="btn-secondary-custom" onclick="closeSupplierModal()">Cancel</button>
          <button type="submit" id="btn-save-sup" class="btn-primary-custom">Save Supplier</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/purchases.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      loadSuppliersPage();
    });
  </script>
</body>
</html>
