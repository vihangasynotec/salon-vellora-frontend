<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchasing & Stock Inward — Salon Vellora</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <div id="app-sidebar-placeholder"></div>

    <main class="app-main">
      <div id="app-topbar-placeholder"></div>

      <div class="app-content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px;">
          <div>
            <h2 style="font-size:1.3rem;font-weight:700;">Purchase Inward & Supplier Invoices</h2>
            <p style="font-size:0.8rem;color:var(--text-muted);margin:0;">Receive stock shipments, update product quantities, and manage vendor payables</p>
          </div>
          <div style="display:flex;gap:8px;">
            <a href="suppliers.html" class="btn-secondary-custom">
              <i data-lucide="building-2"></i> View Suppliers
            </a>
            <button class="btn-primary-custom" onclick="openNewPurchaseModal()" data-permission="purchases.create">
              <i data-lucide="truck"></i> New Stock Inward
            </button>
          </div>
        </div>

        <div class="table-custom-container">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Purchase No.</th>
                <th>Supplier</th>
                <th>Invoice Ref</th>
                <th>Date</th>
                <th>Total Amount</th>
                <th>Paid Amount</th>
                <th>Payment Status</th>
                <th>Logged By</th>
              </tr>
            </thead>
            <tbody id="purchases-table-body">
              <tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--text-muted);">Loading purchases...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- NEW PURCHASE MODAL -->
  <div class="modal-overlay" id="purchase-modal">
    <div class="modal-card" style="max-width: 650px;">
      <div class="modal-header-custom">
        <h3 class="card-title-clean">Record Stock Inward / Purchase</h3>
        <button class="btn-close-modal" style="background:none;border:none;cursor:pointer;" onclick="closePurchaseModal()"><i data-lucide="x"></i></button>
      </div>
      <form onsubmit="handleSavePurchase(event)">
        <div class="modal-body-custom">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;">
            <div>
              <label class="form-label-custom">Supplier *</label>
              <select id="po-supplier" class="form-select-custom" required></select>
            </div>
            <div>
              <label class="form-label-custom">Supplier Invoice Ref #</label>
              <input type="text" id="po-ref" class="form-control-custom" placeholder="e.g. INV-98214">
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem;">
            <div>
              <label class="form-label-custom">Purchase Date *</label>
              <input type="date" id="po-date" class="form-control-custom" required>
            </div>
            <div>
              <label class="form-label-custom">Amount Paid Now (LKR)</label>
              <input type="number" id="po-paid" class="form-control-custom" value="0" min="0">
            </div>
          </div>

          <h4 style="font-size:0.85rem;font-weight:700;margin-bottom:6px;">Items Inwarded</h4>
          <div id="po-items-list" style="margin-bottom:1rem;">
            <!-- Dynamically populated rows -->
          </div>
          <button type="button" class="btn-soft-pink" onclick="addPurchaseItemRow()" style="margin-bottom:1rem;">
            <i data-lucide="plus"></i> Add Product Line
          </button>
        </div>
        <div class="modal-footer-custom">
          <button type="button" class="btn-secondary-custom" onclick="closePurchaseModal()">Cancel</button>
          <button type="submit" id="btn-save-po" class="btn-primary-custom">Save & Inward Stock</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/purchases.js"></script>
</body>
</html>
