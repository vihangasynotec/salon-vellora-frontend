<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Categories — Salon Vellora</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <div id="app-sidebar-placeholder"></div>

    <main class="app-main">
      <div id="app-topbar-placeholder"></div>

      <div class="app-content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
          <div>
            <h2 style="font-size:1.3rem;font-weight:700;">Service Categories</h2>
            <p style="font-size:0.8rem;color:var(--text-muted);margin:0;">Organize treatments, hair styling, bridal & spa categories</p>
          </div>
          <button class="btn-primary-custom" onclick="openCategoryModal()" data-permission="services.create">
            <i data-lucide="plus-circle"></i> Add Category
          </button>
        </div>

        <div class="table-custom-container">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Display Order</th>
                <th>Category Name</th>
                <th>Slug</th>
                <th>Description</th>
                <th>Total Services</th>
              </tr>
            </thead>
            <tbody id="categories-table-body">
              <tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--text-muted);">Loading categories...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ADD CATEGORY MODAL -->
  <div class="modal-overlay" id="category-modal">
    <div class="modal-card" style="max-width: 440px;">
      <div class="modal-header-custom">
        <h3 class="card-title-clean">New Service Category</h3>
        <button class="btn-close-modal" style="background:none;border:none;cursor:pointer;" onclick="closeCategoryModal()"><i data-lucide="x"></i></button>
      </div>
      <form onsubmit="handleSaveCategory(event)">
        <div class="modal-body-custom">
          <div style="margin-bottom:1rem;">
            <label class="form-label-custom">Category Name *</label>
            <input type="text" id="cat-name" class="form-control-custom" required placeholder="e.g. Bridal Dressing">
          </div>
          <div style="margin-bottom:1rem;">
            <label class="form-label-custom">Display Order (Sort Index)</label>
            <input type="number" id="cat-order" class="form-control-custom" value="1" min="1">
          </div>
          <div>
            <label class="form-label-custom">Description</label>
            <textarea id="cat-desc" class="form-control-custom" rows="2" placeholder="Brief summary of treatments..."></textarea>
          </div>
        </div>
        <div class="modal-footer-custom">
          <button type="button" class="btn-secondary-custom" onclick="closeCategoryModal()">Cancel</button>
          <button type="submit" id="btn-save-cat" class="btn-primary-custom">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/services.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      loadCategoriesPage();
    });
  </script>
</body>
</html>
