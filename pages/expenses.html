<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon Expenses — Salon Vellora</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <div id="app-sidebar-placeholder"></div>

    <main class="app-main">
      <div id="app-topbar-placeholder"></div>

      <div class="app-content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px;">
          <div>
            <h2 style="font-size:1.3rem;font-weight:700;">Operational Expenses</h2>
            <p style="font-size:0.8rem;color:var(--text-muted);margin:0;">Utilities, rent, beauty supplies, refreshments and daily maintenance costs</p>
          </div>
          <button class="btn-primary-custom" onclick="openExpenseModal()" data-permission="expenses.create">
            <i data-lucide="plus-circle"></i> Log Expense
          </button>
        </div>

        <div class="table-custom-container">
          <table class="table-custom">
            <thead>
              <tr>
                <th>Expense #</th>
                <th>Title / Description</th>
                <th>Category</th>
                <th>Date</th>
                <th>Payment Mode</th>
                <th>Amount</th>
                <th>Recorded By</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="expenses-table-body">
              <tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--text-muted);">Loading expenses...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- EXPENSE MODAL -->
  <div class="modal-overlay" id="expense-modal">
    <div class="modal-card" style="max-width: 460px;">
      <div class="modal-header-custom">
        <h3 class="card-title-clean">Log Salon Expense</h3>
        <button class="btn-close-modal" style="background:none;border:none;cursor:pointer;" onclick="closeExpenseModal()"><i data-lucide="x"></i></button>
      </div>
      <form onsubmit="handleSaveExpense(event)">
        <div class="modal-body-custom">
          <div style="margin-bottom:1rem;">
            <label class="form-label-custom">Expense Title *</label>
            <input type="text" id="exp-title" class="form-control-custom" required placeholder="e.g. Monthly Electricity Bill (CEB)">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;">
            <div>
              <label class="form-label-custom">Category *</label>
              <select id="exp-cat" class="form-select-custom" required></select>
            </div>
            <div>
              <label class="form-label-custom">Amount (LKR) *</label>
              <input type="number" id="exp-amount" class="form-control-custom" required min="1" step="0.01">
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;">
            <div>
              <label class="form-label-custom">Expense Date *</label>
              <input type="date" id="exp-date" class="form-control-custom" required>
            </div>
            <div>
              <label class="form-label-custom">Payment Method</label>
              <select id="exp-method" class="form-select-custom">
                <option value="cash">Cash in Hand</option>
                <option value="bank_transfer">Bank Transfer</option>
                <option value="card">Company Card</option>
              </select>
            </div>
          </div>
          <div>
            <label class="form-label-custom">Notes / Receipt Remarks</label>
            <textarea id="exp-notes" class="form-control-custom" rows="2" placeholder="e.g. Paid at Pinnaduwa post office..."></textarea>
          </div>
        </div>
        <div class="modal-footer-custom">
          <button type="button" class="btn-secondary-custom" onclick="closeExpenseModal()">Cancel</button>
          <button type="submit" id="btn-save-exp" class="btn-primary-custom">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/expenses.js"></script>
</body>
</html>
